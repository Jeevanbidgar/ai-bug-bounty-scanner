name: "subdomain-discovery"
description: "Comprehensive subdomain enumeration workflow"
category: "recon"

steps:
  - tool: "subfinder"
    parameters:
      target: "{target}"
    output_key: "subdomains"

  - tool: "amass"
    parameters:
      target: "{target}"
    output_key: "amass_results"

parameters:
  target:
    type: "string"
    required: true
    description: "Target domain to scan"

tags: ["recon", "subdomain", "passive"]
