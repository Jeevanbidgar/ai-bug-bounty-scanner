name: "nuclei"
description: "Fast and customizable vulnerability scanner"
category: "vulnerability"
risk_level: "medium"

execution:
  command_template: ["nuclei", "-u", "{target}"]
  timeout: 600
  output_format: "json"

parameters:
  - name: "target"
    type: "string"
    required: true
    description: "Target URL to scan"
  - name: "templates"
    type: "file"
    required: false
    description: "Custom nuclei templates directory"

tags: ["vulnerability", "web", "active"]
