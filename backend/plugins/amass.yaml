name: "amass"
description: "Comprehensive network reconnaissance tool"
category: "recon"
risk_level: "low"

execution:
  command_template: ["amass", "enum", "-passive", "-d", "{target}"]
  timeout: 300
  output_format: "text"

parameters:
  - name: "target"
    type: "string"
    required: true
    description: "Target domain to enumerate"

tags: ["passive", "recon", "dns"]
