[package]
name = "ai-bug-bounty-scanner"
version = "2.0.0"
description = "A safe, auditable, cross-platform desktop-first application that orchestrates recon & pentest tools"
authors = ["Jeevan Bidgar"]
license = "MIT"
repository = "https://github.com/Jeevanbidgar/UniHack-Cross-Platform-Tool-Orchestrator"
default-run = "ai-bug-bounty-scanner"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.29"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
which = "4.4"
sha2 = "0.10"
semver = "1.0"
dirs = "5.0"
once_cell = "1.0"
rmcp = { version = "2.2.0", features = ["transport-io", "schemars"] }
ipnet = { version = "2.11", features = ["serde"] }
hmac = "0.12"
hex = "0.4"
url = { version = "2.5", features = ["serde"] }
keyring = "4.1.5"

# Database dependencies
sqlx = { version = "0.7", default-features = false, features = [ "runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate", "macros" ] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"

[dev-dependencies]
futures = "0.3"
tempfile = "3.0"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
