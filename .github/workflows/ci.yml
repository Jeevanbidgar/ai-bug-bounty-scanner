name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.9"
  NODE_VERSION: "18"

jobs:
  # Backend testing
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install black flake8 mypy
          black --check backend/ || true
          flake8 backend/ --max-line-length=100 --ignore=E203,W503 || true
          mypy backend/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage

  # Frontend testing
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linting
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm run test -- --coverage --watchAll=false

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # macOS-specific testing for Homebrew functionality
  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Homebrew
        run: |
          brew --version
          brew update
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: frontend/package.json
          args: --no-bundle

      # Test Homebrew functionality
      - name: Test Homebrew Detection
        run: |
          echo "Testing Homebrew detection..."
          cargo test --package ai-bug-bounty-scanner --test integration_tests homebrew_manager::tests -- --nocapture

      - name: Test Homebrew Registry
        run: |
          echo "Testing Homebrew registry..."
          cargo test --package ai-bug-bounty-scanner homebrew_registry -- --nocapture

      - name: Verify Critical Formulas
        run: |
          echo "Verifying critical Homebrew formulas exist..."
          brew info nuclei || echo "nuclei formula check failed"
          brew info httpx || echo "httpx formula check failed"
          brew info subfinder || echo "subfinder formula check failed"
          brew info nmap || echo "nmap formula check failed"

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run security scans
        run: |
          # Python security scanning
          bandit -r backend/ -f json -o bandit-report.json || true
          safety check --json || true

          # Dependency vulnerability scanning
          pip install safety
          safety check

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # Docker build (optional)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: ai-bug-bounty-scanner/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: ai-bug-bounty-scanner/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release builds
  release:
    runs-on: ${{ matrix.os }}
    needs: [backend-test, frontend-test, macos-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: macos-14  # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            name: macos-arm64
            brew_prefix: /opt/homebrew
          - os: macos-13  # Intel Macs
            target: x86_64-apple-darwin
            name: macos-x64
            brew_prefix: /usr/local

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # macOS-specific: Set up Homebrew
      - name: Setup Homebrew (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          echo "Setting up Homebrew for ${{ matrix.os }}..."
          brew --version
          brew update

          # Ensure Homebrew binaries are in PATH
          echo "${{ matrix.brew_prefix }}/bin" >> $GITHUB_PATH

          # Verify Homebrew is working
          which brew
          brew --version

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: frontend/package.json
          args: --no-bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ai-bug-bounty-scanner-${{ matrix.name }}
          path: |
            target/release/bundle/**/*
            frontend/dist/**/*

  # Deploy to staging (optional)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, macos-test, security-scan, release]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment logic here
          # e.g., docker-compose up, kubectl apply, etc.
