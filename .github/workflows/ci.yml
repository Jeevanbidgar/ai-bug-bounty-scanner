name: UniHack desktop CI

on:
  push:
    branches:
      - main
      - application
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Frontend and Rust quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Audit production JavaScript dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Lint and build frontend
        run: |
          npm run lint --prefix frontend
          npm run build --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install chromium

      - name: Run responsive frontend tests
        run: npm run test:e2e --prefix frontend -- --grep-invert "@visual"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run strict Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

  visual:
    name: macOS visual regression gates
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install chromium

      - name: Run macOS visual baselines
        run: npm run test:e2e --prefix frontend -- --grep "@visual"

  package:
    name: Package ${{ matrix.name }}
    needs:
      - quality
      - visual
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install locked JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run platform Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked --target ${{ matrix.target }}

      - name: Prepare target-specific daemon and MCP sidecars
        run: npm run prepare:sidecars -- --target ${{ matrix.target }}

      - name: Build unsigned desktop bundles
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: unihack-${{ matrix.name }}-unsigned
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
